services:
  db:
    image: postgres:14-alpine
    container_name: botfarm_db
    environment:
      POSTGRES_USER: oppennec
      POSTGRES_PASSWORD: password
      POSTGRES_DB: botfarm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oppennec -d botfarm"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: botfarm_app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://oppennec:password@db:5432/botfarm
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data: